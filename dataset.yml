description: |-
  全国の食品営業許可・届出の施設一覧（飲食店・菓子製造業・食肉販売業など約 136 万件）です。Japan Food Facilities が自治体と厚生労働省のオープンデータを共通の列に統一したもので、毎週取得し直します。

  出典：Japan Food Facilities（各自治体・厚生労働省の食品営業許可のオープンデータを加工）。取得元ごとのライセンスは各行の license_id 列にあります。Queria が加工したものです。
