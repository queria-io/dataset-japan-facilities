version: 2

models:
- name: permit
  access: public
  columns:
  - name: source
    data_tests:
    - not_null
  - name: license_id
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - CC-BY-4.0
          - CC-BY-3.0
          - CC-BY-2.1-JP
          - CC-BY-2.0
          - CC-BY
          - CC0-1.0
          - JP-PDL-1.0

- name: permit_i2fas
  access: public
  columns:
  - name: source
    data_tests:
    - not_null
  - name: license_id
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - JP-PDL-1.0
